<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>メニュー | NEKONOIRU CAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html">
        <img src="images/logo.png" alt="">
        <span>NEKONOIRU CAFE</span>
      </a>
      <nav><a href="index.html">ホーム</a>
        <a href="cats.html">ねこたち</a>
        <a href="menu.html" aria-current="page">メニュー</a>
        <a href="guide.html">ご利用案内</a>
        <a href="access.html">アクセス</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="pagehead">
      <div class="wrap">
        <h1 style="font-size:clamp(28px,5vw,42px)">メニュー</h1>
        <p>焼き菓子は毎朝、店内のオーブンで焼いています。「NEKONOIRU CAFE限定」は当店だけのオリジナルです。</p>
      </div>
    </div>
    <section>
      <div class="wrap">
        <div class="tabs" role="tablist" id="tabs"></div>
        <ul class="menu" id="menuList"></ul>
        <div class="treat">
          <span class="treat-n">ねこたちのおやつ<em>スタッフからお渡しします。ねこたちにあげられるのは、こちらのおやつだけです。</em></span>
          <span class="treat-p">500円</span>
        </div>
      </div>
    </section>

    <!-- Instagram -->
    <section>
      <div class="wrap insta-wrap">
        <p class="lead" style="margin-bottom:16px">ねこたちの毎日を、Instagramで更新中です。</p>
        <button class="insta insta-icon" id="instaOpen" type="button" aria-haspopup="dialog" aria-label="Instagramを見る">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Instagramモーダル -->
    <div class="modal" id="instaModal" role="dialog" aria-modal="true" aria-label="Instagram" hidden>
      <div class="modal-body">
        <button class="modal-close" id="instaClose" type="button" aria-label="閉じる">×</button>
        <img src="images/rogo-insta.png" alt="NEKONOIRU CAFE のInstagram投稿のイメージ">
      </div>
    </div>
  </main>

  <!-- 歩く猫のイラスト -->
  <div class="walker" aria-hidden="true">
    <img src="images/menu.png" alt="">
  </div>


  <footer>© NEKONOIRU CAFE / ねこの機嫌により、お休みをいただくことはありません。</footer>
  <script src="script.js"></script>

</html>
